# NOTE: if you add new targets here make sure to also change
# `ferrocene/packages.toml` to include it in new releases.

---
version: 2.1

# Parameter values are determined by `calculate-parameters.py` dynamically
# before the build starts. The script must be able to calculate the value of
# ALL parameters, otherwise it will error out.
#
# Parameters with the following prefixes are supported:
#
# * `docker-images-hash`: the hash for docker image tags.
# * `docker-repository-url--`: calculates the URL of an ECR repository
# * `llvm-rebuild`: calculates if the llvm cache must be invalidated
# * `targets--`: calculates the compilation targets to execute the job for
#
parameters:
  docker-images-hash:
    type: string
    default: ""
  docker-repository-url--ci-docker-images:
    type: string
    default: ""
  llvm-rebuild:
    type: boolean
    default: false
  targets--x86_64-unknown-linux-gnu--build:
    type: string
    default: ""
  targets--x86_64-unknown-linux-gnu--self-test:
    type: string
    default: ""
  targets--x86_64-unknown-linux-gnu--std:
    type: string
    default: ""
  targets--aarch64-unknown-linux-gnu--build:
    type: string
    default: ""
  targets--aarch64-unknown-linux-gnu--self-test:
    type: string
    default: ""
  targets--aarch64-apple-darwin--build:
    type: string
    default: ""
  targets--aarch64-apple-darwin--self-test:
    type: string
    default: ""
  targets--x86_64-pc-windows-msvc--build:
    type: string
    default: ""
  targets--x86_64-pc-windows-msvc--self-test:
    type: string
    default: ""
  # use this parameter to disable building the windows host. This is useful to cut down build times and
  # cost in cases where you want to experiment with linux builds and are not interested in windows results
  full-build-x86_64-pc-windows-msvc-host:
    type: boolean
    default: true
  # use this parameter to disable building the darwin host. This is useful to cut down build times and
  # cost in cases where you want to experiment with linux builds and are not interested in darwin results
  full-build-aarch64-darwin-host:
    type: boolean
    default: true
  # This is a stable workflow id that doesn't change on rerun
  #
  # The stable workflow id is used to identify intermediary containers used by this workflow.
  #
  # We can't key off the commit because we want to rebuild the test-runner image if the underlying
  # base image is updated.
  #
  # We can't key off CirlceCIs workflow ID because it will change if someone uses any of the rerun
  # options, for example "rerun with SSH", causing any step that uses an intermediary image to fail.
  #
  # Instead we take the setup workflow id because it's convenient, but any random id would work.
  stable-workflow-id:
    type: string
    default: ""

  # CircleCI has no local variables and the recommendation is to use a parameter with a default value
  # but since our paramters are all provided by calculate-parameters.py, we need to have the default there.
  awscli-version:
    type: string
    default: ""

  # The qemu-version to run emulated tests in (read from ferrocene/ci/qemu-version by calcualate-params.py)
  qemu-version:
    type: string
    default: ""

orbs:
  win: circleci/windows@5.0
  ferrocene: ferrocene/ferrocene-common@26080.4.0 # https://circleci.com/developer/orbs/orb/ferrocene/ferrocene-common?version=26080.4.0#orb-source

jobs:
  # Container dedicated to running ad-hoc tests that don't depend on an
  # individual target. If you have a test you don't know where to run it, this
  # is the place for it.
  misc-checks:
    executor: &executor-x86_64-runner
      name: ferrocene/docker
      image_tag: runner--<< pipeline.parameters.docker-images-hash >>--x86_64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-amd64-small
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        ./x.py test $(ferrocene/ci/split-tasks.py test:misc-checks)
    steps:
      - ferrocene/aws_oidc_auth
      - ferrocene/checkout:
          llvm_subset: true
      - run:
          name: Perform licensing checks
          command: |
            uvx reuse@5.1.1 --include-submodules lint
      - ferrocene/ci

  # Generate a SBOM for the Ferrocene repository
  sbom-gen:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-small
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        ./x.py dist ferrocene-sbom
    steps:
      - ferrocene-job-dist:
          llvm_subset: false

  # x86_64-unknown-linux-gnu jobs
  x86_64-linux-build:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: << pipeline.parameters.targets--x86_64-unknown-linux-gnu--build >>
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        ./x.py --stage 2 build cargo library src/tools/rustdoc symbol-report
        ./x.py --stage 1 build compiletest coverage-dump src/tools/rustdoc src/tools/run-make-support
    steps: [ferrocene-job-build]

  x86_64-linux-docs:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-medium
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TEST_OUTCOMES_DIR: /tmp/test-outcomes
      FERROCENE_COVERAGE_OUTCOMES_DIR: /tmp/coverage-outcomes
      SCRIPT: |
        ferrocene/ci/scripts/fetch-test-outcomes.sh
        ferrocene/ci/scripts/fetch-coverage-outcomes.sh
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        # Run dist before test to make sure the tarballs we test are uploaded
        # to CI beforehand, for manual inspection in case of failures.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:docs)
        ./x.py --stage 2 test $(ferrocene/ci/split-tasks.py test:docs)
    steps:
      - ferrocene-job-dist:
          restore-from-job: x86_64-linux-build

  x86_64-linux-dist:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist)
    steps:
      - ferrocene-job-dist:
          restore-from-job: x86_64-linux-build

  x86_64-linux-dist-tools:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:tools)
    steps:
      - ferrocene-job-dist:
          restore-from-job: x86_64-linux-build

  x86_64-linux-dist-targets:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: << pipeline.parameters.targets--x86_64-unknown-linux-gnu--std >>
      SCRIPT: |
        ./x.py --stage 2 dist rust-std
    steps:
      - ferrocene-job-dist:
          qnx7: true
          restore-from-job: x86_64-linux-build

  x86_64-linux-dist-targets-qnx8:
    executor:
      name: ferrocene/docker
      image_tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--x86_64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: aarch64-unknown-qnx,x86_64-pc-qnx
      SCRIPT: |
        ./x.py --stage 2 dist rust-std
    steps:
      - ferrocene-job-dist:
          qnx8: true
          restore-from-job: x86_64-linux-build

  x86_64-linux-dist-src:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-medium
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:src)
    steps:
      - ferrocene-job-dist:
          restore-from-job: x86_64-linux-build
          # We need the whole LLVM clone to be able to include the full source
          # code into the tarball we ship to customers.
          llvm_subset: false

  linux-generic-test-container:
    executor: << parameters.executor >>
    parameters:
      executor:
        type: executor
      job:
        type: string
      test-variant:
        type: string
      resource-class:
        type: string
      extra-args:
        type: string
        default: ""
      ferrocene_host:
        type: string
      restore_from_job:
        type: string
    resource_class: << parameters.resource-class >>
    environment:
      FERROCENE_HOST: << parameters.ferrocene_host >>
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 test $(ferrocene/ci/split-tasks.py << parameters.job >>) --ferrocene-test-one-crate-per-cargo-call --test-variant << parameters.test-variant >> << parameters.extra-args >>
    steps:
      - ferrocene-job-test-container:
          restore-from-job: << parameters.restore_from_job >>

  x86_64-linux-traceability-matrix:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-small
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TEST_OUTCOMES_DIR: /tmp/test-outcomes
      SCRIPT: |
        ferrocene/ci/scripts/fetch-test-outcomes.sh
        ./x.py run ferrocene/tools/traceability-matrix
    steps:
      - ferrocene/aws_oidc_auth
      - ferrocene/checkout:
          llvm_subset: true
      - ferrocene/ci
      - store_artifacts:
          path: build/x86_64-unknown-linux-gnu/ferrocene/traceability-matrix.html
          destination: reports

  x86_64-linux-library-coverage:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        ./x.py test --stage=1 --coverage=library library/core library/alloc --tests
    steps:
      - ferrocene/aws_oidc_auth
      - ferrocene/checkout:
          llvm_subset: true
      # - run:
      #     name: Restore files from the x86_64-linux-build job
      #     command: ferrocene/ci/scripts/persist-between-jobs.sh restore x86_64-linux-build
      - ferrocene/ci

  llvm--x86_64-unknown-linux-gnu:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-large
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      SCRIPT: ferrocene/ci/scripts/llvm_cache.py prepare
      # This tries to strike a balance between the highest concurrency possible
      # and not running out of memory during a build. If building LLVM fails
      # due to the OOM killer killing the build, decrease this number.
      LLVM_BUILD_PARALLELISM: 16
    steps:
      - when:
          condition: << pipeline.parameters.llvm-rebuild >>
          steps:
            - ferrocene/aws_oidc_auth
            - ferrocene/checkout
            - ferrocene/ci
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  x86_64-linux-self-test:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-tiny
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: << pipeline.parameters.targets--x86_64-unknown-linux-gnu--self-test >>
    steps:
      - ferrocene/git_shallow_clone:
          depth: 1
      - ferrocene/aws_oidc_auth
      - setup-qnx-toolchain:
          qnx_version: qnx710-472
      - run:
          name: Download dist artifacts and run the self-test tool
          command: ferrocene/ci/scripts/run-self-test.sh

  x86_64-linux-self-test-qnx8:
    executor:
      name: ferrocene/docker
      image_tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--x86_64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-amd64-tiny
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: aarch64-unknown-qnx,x86_64-pc-qnx
    steps:
      - ferrocene/git_shallow_clone:
          depth: 1
      - ferrocene/aws_oidc_auth
      - setup-qnx-toolchain:
          qnx_version: qnx800-141
      - run:
          name: Download dist artifacts and run the self-test tool
          command: ferrocene/ci/scripts/run-self-test.sh

  # aarch64-unknown-linux-gnu jobs

  llvm--aarch64-unknown-linux-gnu:
    executor: &executor-aarch64-builder
      name: ferrocene/docker
      image_tag: builder--<< pipeline.parameters.docker-images-hash >>--aarch64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-arm64-large
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      SCRIPT: ferrocene/ci/scripts/llvm_cache.py prepare
      # This tries to strike a balance between the highest concurrency possible
      # and not running out of memory during a build. If building LLVM fails
      # due to the OOM killer killing the build, decrease this number.
      LLVM_BUILD_PARALLELISM: 24
    steps:
      - when:
          condition: << pipeline.parameters.llvm-rebuild >>
          steps:
            - ferrocene/aws_oidc_auth
            - ferrocene/checkout
            - ferrocene/ci
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-linux-build:
    executor: *executor-aarch64-builder
    resource_class: ferrocene/k8s-arm64-large
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-unknown-linux-gnu--build >>
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        ./x.py --stage 2 build cargo library src/tools/rustdoc symbol-report
        ./x.py --stage 1 build compiletest coverage-dump src/tools/rustdoc src/tools/run-make-support
        ./x build src/tools/remote-test-server --target "aarch64-unknown-linux-gnu,aarch64-rhivos2-linux-gnu" --stage "2"
    steps: [ferrocene-job-build]

  aarch64-linux-dist:
    executor: *executor-aarch64-builder
    resource_class: ferrocene/k8s-arm64-large
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist)
    steps:
      - ferrocene-job-dist:
          restore-from-job: aarch64-linux-build

  aarch64-linux-dist-tools:
    executor: &executor-aarch64-runner
      name: ferrocene/docker
      image_tag: runner--<< pipeline.parameters.docker-images-hash >>--aarch64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-arm64-large
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:tools)
    steps:
      - ferrocene-job-dist:
          restore-from-job: aarch64-linux-build

  aarch64-linux-self-test:
    executor:
      name: ferrocene/docker
      image_tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--aarch64
      registry: << pipeline.parameters.docker-repository-url--ci-docker-images >>
    resource_class: ferrocene/k8s-arm64-small
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-unknown-linux-gnu--self-test >>
    steps:
      - ferrocene/git_shallow_clone:
          depth: 1
      - ferrocene/aws_oidc_auth
      - run:
          name: Download dist artifacts and run the self-test tool
          command: ferrocene/ci/scripts/run-self-test.sh

  aarch64-linux-library-coverage:
    executor: *executor-aarch64-runner
    resource_class: ferrocene/k8s-arm64-large
    environment:
      FERROCENE_HOST: aarch64-unknown-linux-gnu
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        ./x.py test --stage=1 --coverage=library library/core library/alloc --tests
    steps:
      - ferrocene/aws_oidc_auth
      - ferrocene/checkout:
          llvm_subset: true
      - ferrocene/ci

  # aarch64-apple-darwin jobs

  llvm--aarch64-apple-darwin:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium # 6 cores
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      FERROCENE_TARGETS: aarch64-apple-darwin
      SCRIPT: ferrocene/ci/scripts/llvm_cache.py prepare
      # This tries to strike a balance between the highest concurrency possible
      # and not running out of memory during a build. If building LLVM fails
      # due to using too much memory, decrease this number.
      LLVM_BUILD_PARALLELISM: 12
    steps:
      - when:
          condition:
            and:
              - << pipeline.parameters.llvm-rebuild >>
              - << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene/checkout
            - ferrocene/setup:
                awscli_version: << pipeline.parameters.awscli-version >>
                os: darwin
            - ferrocene/ci
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-darwin-build:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium # 6 cores
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-apple-darwin--build >>
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        ./x.py --stage 2 build cargo library src/tools/rustdoc symbol-report
        ./x.py --stage 1 build compiletest coverage-dump src/tools/rustdoc src/tools/run-make-support
    steps:
      - when:
          condition: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene-job-build:
                os: darwin
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-darwin-dist:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium # 6 cores
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-apple-darwin--build >>
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist)
        ./x.py --stage 2 dist rust-std
    steps:
      - when:
          condition: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene-job-dist:
                os: darwin
                restore-from-job: aarch64-darwin-build
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-darwin-dist-tools:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium # 6 cores
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-apple-darwin--build >>
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:tools)
    steps:
      - when:
          condition: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene-job-dist:
                os: darwin
                restore-from-job: aarch64-darwin-build
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-darwin-self-test:
    macos:
      xcode: "27.0.0"
    resource_class: m4pro.medium # 6 cores
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      FERROCENE_TARGETS: << pipeline.parameters.targets--aarch64-apple-darwin--self-test >>
    steps:
      - when:
          condition: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene/git_shallow_clone:
                depth: 1
            - ferrocene/setup:
                awscli_version: << pipeline.parameters.awscli-version >>
                os: darwin
            - run:
                name: Download dist artifacts and run the self-test tool
                command: ferrocene/ci/scripts/run-self-test.sh
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  aarch64-darwin-generic-test-runner:
    macos:
      xcode: "27.0.0"
    parameters:
      job:
        type: string
      resource-class:
        type: string
    resource_class: << parameters.resource-class >>
    environment:
      FERROCENE_HOST: aarch64-apple-darwin
      SCRIPT: |
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 test $(ferrocene/ci/split-tasks.py << parameters.job >>) --ferrocene-test-one-crate-per-cargo-call
    steps:
      - when:
          condition: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene-job-test-container:
                os: darwin
                restore-from-job: aarch64-darwin-build
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  # x86_64-pc-windows-msvc jobs

  llvm--x86_64-pc-windows-msvc:
    executor:
      name: win/server-2022
      # Experimental choise: This makes the job take slightly more than half of the time
      # for a 10-15% increase in cost.
      size: xlarge # 16-core
      shell: bash.exe -euo pipefail
    environment:
      FERROCENE_BUILD_HOST: x86_64-pc-windows-msvc
      FERROCENE_HOST: x86_64-pc-windows-msvc
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py prepare
      # This tries to strike a balance between the highest concurrency possible
      # and not running out of memory during a build. If building LLVM fails
      # due to the OOM killer killing the build, decrease this number.
      #
      # # On Windows, we tune this down because the CircleCI's agent occasionally
      # tries to contact the runner and will time out, killing the build. We set
      # the LLVM parallelism to 15 to ensure 1 core is always free to respond.
      LLVM_BUILD_PARALLELISM: 15
    steps:
      - run:
          name: Make sure git autocrlf is false
          command: git config --global core.autocrlf false
      - when:
          condition:
            and:
              - << pipeline.parameters.llvm-rebuild >>
              - << pipeline.parameters.full-build-x86_64-pc-windows-msvc-host >>
          steps:
            - ferrocene/checkout
            - ferrocene/setup:
                awscli_version: << pipeline.parameters.awscli-version >>
                override_installed: false
                os: windows
                llvm_build: true
            - ferrocene/ci
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  # This job caused us to extend our CircleCI TTL via
  # https://support.circleci.com/hc/en-us/articles/17136864790299-How-to-configure-your-OIDC-token-s-TTL-at-the-Organization-and-Project-Levels
  x86_64-windows-dist:
    executor:
      name: win/server-2022
      # Experimental choise: This makes the job take slightly more than half of the time
      # for a 10-15% increase in cost.
      size: xlarge # 16-core
      shell: bash.exe -euo pipefail
    environment:
      FERROCENE_BUILD_HOST: x86_64-pc-windows-msvc
      FERROCENE_HOST: x86_64-pc-windows-msvc
      FERROCENE_TARGETS: << pipeline.parameters.targets--x86_64-pc-windows-msvc--build >>
      # It's theorhetically possible to split up this job just as we split up the linux builds,
      # but the long startup times at circle make it not efficient. It takes ~10 minutes until
      # the machine has started and installed all dependencies and is ready to start the actual job
      #
      # If you ever want to embark on that endeavour because you're in an environment where startup
      # time of windows hosts are faster, then the script `ferrocene/ci/scripts/build_cache.py` will
      # be helpful to build/restore the cache.
      SCRIPT: |
        ferrocene/ci/scripts/llvm_cache.py download
        # See ferrocene/ci/split-tasks.py for a list of tasks executed by this.
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist)
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:tools)
        ./x.py --stage 2 dist rust-std
    steps:
      - when:
          condition: << pipeline.parameters.full-build-x86_64-pc-windows-msvc-host >>
          steps:
            - ferrocene-job-dist:
                os: windows

      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  x86_64-windows-self-test:
    parameters:
      qnx_version:
        description: "The QNX version to test (currently supported: qnx710-472, qnx800-141)"
        type: string
      targets:
        description: The targets to test (must match qnx version)
        type: string
    executor:
      name: win/server-2022
      size: medium # 4-core
      shell: bash.exe -euo pipefail
    environment:
      FERROCENE_BUILD_HOST: x86_64-pc-windows-msvc
      FERROCENE_HOST: x86_64-pc-windows-msvc
      FERROCENE_TARGETS: << parameters.targets >>
    steps:
      - when:
          condition: << pipeline.parameters.full-build-x86_64-pc-windows-msvc-host >>
          steps:
            - ferrocene/git_shallow_clone:
                depth: 1
            - ferrocene/setup:
                awscli_version: << pipeline.parameters.awscli-version >>
                override_installed: false
                os: windows
            - setup-qnx-toolchain:
                qnx_version: << parameters.qnx_version >>
            - run:
                name: Download dist artifacts and run the self-test tool
                command: ferrocene/ci/scripts/run-self-test.sh
      - run:
          name: Empty step to make sure the job always has steps
          command: echo

  # Test VMs
  qnx-generic-test-vm:
    executor: linux-vm
    parameters:
      tasks:
        type: string
      test-variant:
        type: string
      resource-class:
        type: string
      extra-args:
        type: string
        default: ""
      qnx_version:
        description: The QNX version to install (currently supported qnx710-472, qnx800-141)
        type: string
      targets:
        description: "The compilation target (must match qnx_version, supported: x86_64-pc-nto-qnx710, x86_64-pc-qnx)"
        type: string
      target_arch:
        description: "The target architecture (must match target, suppored: aarch64, x86_64)"
        type: string
    resource_class: << parameters.resource-class >>
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: << parameters.targets >>
      SCRIPT: |
        set +u; source ./<< parameters.qnx_version >>/qnxsdp-env.sh; set -u; RUST_TEST_THREADS=1 TEST_DEVICE_ADDR=172.31.1.105:12345 ./x.py --stage 2 test << parameters.tasks >> --ferrocene-test-one-crate-per-cargo-call --test-variant << parameters.test-variant >> << parameters.extra-args >>
    steps:
      - ferrocene/checkout
      - ferrocene/setup:
          awscli_version: << pipeline.parameters.awscli-version >>
      - setup-qnx-toolchain:
          source-env-script: false
          qnx_version: << parameters.qnx_version >>
      - ferrocene-job-test-vm:
          checkout-source: false
          docker-image-tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          run-emulator-docker-image-tag: emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          restore-from-job: x86_64-linux-build
          emulator-script: "set +u; source ./<< parameters.qnx_version >>/qnxsdp-env.sh; set -u; ./ferrocene/ci/scripts/emulated-<< parameters.target_arch >>-<< parameters.qnx_version >>-test-runner.sh"

  # Misc jobs
  wasm-dist-oxidos:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-medium
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
      FERROCENE_TARGETS: wasm32-unknown-unknown
      SCRIPT: |
        ./x.py --stage 2 dist $(ferrocene/ci/split-tasks.py dist:oxidos)
    steps:
      - ferrocene-job-dist:
          restore-from-job: x86_64-linux-build

  finish-build:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-tiny
    environment:
      FERROCENE_HOST: x86_64-unknown-linux-gnu
    steps:
      # if at least one of the conditions is set to false, we're not building the
      # whole set and we want to fail the build
      - when:
          condition:
            or:
              - not: << pipeline.parameters.full-build-x86_64-pc-windows-msvc-host >>
              - not: << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - run:
                name: Fail build as incomplete
                command: "false"
      # only if both windows and darwin builds are enabled we want to continue the build and
      # do the final checks
      - when:
          condition:
            and:
              - << pipeline.parameters.full-build-x86_64-pc-windows-msvc-host >>
              - << pipeline.parameters.full-build-aarch64-darwin-host >>
          steps:
            - ferrocene/aws_oidc_auth
            - ferrocene/git_shallow_clone:
                depth: 1
            - run:
                name: Restore files from the x86_64-linux-build
                command: ferrocene/ci/scripts/persist-between-jobs.sh restore x86_64-linux-build
            - run:
                name: Configure
                command: ferrocene/ci/configure.sh
            - run:
                name: Checkout the submodules
                command: ferrocene/ci/scripts/checkout-submodules.sh
            - run:
                name: Generate build metadata
                command: ./x.py dist ferrocene-build-metadata
            # From this point onwards, the commit can be released by the release process.
            - run:
                name: Upload metadata files to S3
                command: ferrocene/ci/scripts/upload-dist-artifacts.sh
            # Unfortunately the validation script for packages.toml has to be executed after the build
            # metadata has been uploaded, as it needs to retrieve some of it from S3.
            #
            # In theory this means a release could be published even when this step failed to execute. In
            # practice it's not a problem, as the failures detected by this script also result in errors
            # during the release process.
            - run:
                name: Verify that all of the expected artifacts were uploaded
                command: ferrocene/ci/scripts/validate-packages-toml.py ${CIRCLE_SHA1}

  # Simple job used to run "something" when no other jobs are supposed to be
  # run. See the `skip` workflow for more information.
  skip:
    executor: *executor-x86_64-runner
    resource_class: ferrocene/k8s-amd64-tiny
    steps:
      - run:
          name: This is a workaround for CircleCI always wanting at least a job per commit.
          command: "true"
      - run:
          name: This job does nothing!
          command: "true"

workflows:
  version: 2

  # Main workflow used by bors to ensure every PR is fully green.
  full:
    when:
      or:
        - equal: [<< pipeline.git.branch >>, "staging"]
        - equal: [<< pipeline.git.branch >>, "trying"]
        - equal: [<< pipeline.git.branch >>, "automation/bors/auto"]
        - equal: [<< pipeline.git.branch >>, "automation/bors/try"]
        - equal: [<< pipeline.trigger_source >>, "api"]
    jobs:
      - ferrocene/build_docker:
          name: build-docker--emulator--x86_64
          image: emulator
          tag: emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: large.gen2
          awscli_version: << pipeline.parameters.awscli-version >>

      - ferrocene/build_docker:
          name: build-docker--builder--aarch64
          image: runner-glibc-2.17
          tag: builder--<< pipeline.parameters.docker-images-hash >>--aarch64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: arm.medium
          awscli_version: << pipeline.parameters.awscli-version >>

      - ferrocene/build_docker:
          name: build-docker--runner--aarch64
          image: runner-glibc-2.34
          tag: runner--<< pipeline.parameters.docker-images-hash >>--aarch64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: arm.medium
          awscli_version: << pipeline.parameters.awscli-version >>

      - ferrocene/build_docker:
          name: build-docker--runner--x86_64
          image: runner-glibc-2.17
          tag: runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: large.gen2
          awscli_version: << pipeline.parameters.awscli-version >>

      - ferrocene/build_docker:
          name: build-docker--qnx-runner--x86_64
          image: qnx-runner
          tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: large.gen2
          awscli_version: << pipeline.parameters.awscli-version >>

      - ferrocene/build_docker:
          name:  build-docker--qnx-runner--aarch64
          image: qnx-runner
          tag: qnx-runner--<< pipeline.parameters.docker-images-hash >>--aarch64
          rebuild: << pipeline.parameters.llvm-rebuild >>
          resource_class: arm.medium
          awscli_version: << pipeline.parameters.awscli-version >>

      - misc-checks:
          requires:
            - build-docker--runner--x86_64

      - llvm--x86_64-unknown-linux-gnu:
          requires:
            - build-docker--runner--x86_64
      - x86_64-linux-build:
          requires:
            - llvm--x86_64-unknown-linux-gnu
      - x86_64-linux-docs:
          requires: &test-outcomes-dependencies
            # Need to depend on all of the test builders to include test
            # outcomes in the qualification documents.
            - misc-checks
            - x86_64-linux-test
            - x86_64-linux-test-flip-link
            - x86_64-linux-test-library
            - x86_64-linux-compiletest
            - x86_64-linux-library-coverage
            - x86_64-qnx-test-library-compiletest
            - x86_64-qnx8-test-library-compiletest
            - aarch64-qnx-test-library-compiletest
            - aarch64-qnx8-test-library-compiletest
            - aarch64-none-test-library-compiletest
            - aarch64-none-test-target-cpu-library-compiletest
            - aarch64r82-none-test-library-compiletest
            - aarch64v8r-none-test-library-compiletest
            - armv7r-eabihf-test-library-compiletest
            - thumbv7em-eabihf-test-library-compiletest
            - thumbv7em-eabihf-test-target-cpu-library-compiletest
            - thumbv7em-eabi-test-library-compiletest
            - thumbv7em-eabi-test-target-cpu-library-compiletest
            - aarch64-linux-test
            - aarch64-linux-test-library
            - aarch64-linux-compiletest
            - aarch64-linux-library-coverage
            - aarch64-linux-rhivos2-test-library-compiletest
      - x86_64-linux-traceability-matrix:
          requires: *test-outcomes-dependencies
      - x86_64-linux-dist:
          requires:
            - x86_64-linux-build
      - x86_64-linux-dist-tools:
          requires:
            - x86_64-linux-build
      - x86_64-linux-dist-targets:
          requires:
            - x86_64-linux-build
      - x86_64-linux-dist-targets-qnx8:
          requires:
            - x86_64-linux-build
      - x86_64-linux-dist-src:
          requires:
            - x86_64-linux-build
      - linux-generic-test-container:
          name: x86_64-linux-test
          executor: *executor-x86_64-runner
          job: test
          resource-class: ferrocene/k8s-amd64-medium
          test-variant: "2021"
          ferrocene_host: x86_64-unknown-linux-gnu
          restore_from_job: x86_64-linux-build
          requires: [ x86_64-linux-build ]
      - linux-generic-test-container:
          name: x86_64-linux-test-flip-link
          executor: *executor-x86_64-runner
          job: test:flip-link
          resource-class: ferrocene/k8s-amd64-medium
          test-variant: "2021"
          extra-args: --target thumbv7em-none-eabi
          ferrocene_host: x86_64-unknown-linux-gnu
          restore_from_job: x86_64-linux-build
          requires: [ x86_64-linux-build ]
      - linux-generic-test-container:
          name: x86_64-linux-test-library
          executor: *executor-x86_64-runner
          job: test:library
          resource-class: ferrocene/k8s-amd64-medium
          test-variant: "2021"
          ferrocene_host: x86_64-unknown-linux-gnu
          restore_from_job: x86_64-linux-build
          requires: [ x86_64-linux-build ]
      - linux-generic-test-container:
          name: x86_64-linux-compiletest
          executor: *executor-x86_64-runner
          job: test:compiletest
          resource-class: ferrocene/k8s-amd64-large
          test-variant: "2021"
          ferrocene_host: x86_64-unknown-linux-gnu
          restore_from_job: x86_64-linux-build
          requires: [ x86_64-linux-build ]
      - x86_64-linux-library-coverage:
          requires:
            - x86_64-linux-build

      - ferrocene/facade_generic_test:
          name: aarch64-none-test-library-compiletest
          target: aarch64-unknown-ferrocene.facade
          test_variant: 2021-cortex-a53
          emulated: "true"
          qemu_arch: qemu-aarch64
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-a53
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: aarch64-none-test-target-cpu-library-compiletest
          target: aarch64-unknown-ferrocene.facade
          test_variant: 2021-specific-cortex-a53
          emulated: "true"
          qemu_arch: qemu-aarch64
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-a53
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64
            - aarch64-none-test-library-compiletest

      - ferrocene/facade_generic_test:
          name: aarch64r82-none-test-library-compiletest
          target: aarch64r82-unknown-ferrocene.facade
          test_variant: 2021-neoverse-v1
          emulated: "true"
          qemu_arch: qemu-aarch64
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: neoverse-v1
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: aarch64v8r-none-test-library-compiletest
          target: aarch64v8r-unknown-ferrocene.facade
          test_variant: 2021-neoverse-v1
          emulated: "true"
          qemu_arch: qemu-aarch64
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: neoverse-v1
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - wasm-dist-oxidos:
          requires:
            - x86_64-linux-build

      - x86_64-linux-self-test:
          requires:
            - x86_64-linux-dist
            - x86_64-linux-dist-tools
            - x86_64-linux-dist-targets
            - aarch64-linux-dist

      - x86_64-linux-self-test-qnx8:
          requires:
            - x86_64-linux-dist
            - x86_64-linux-dist-tools
            - x86_64-linux-dist-targets-qnx8
            - aarch64-linux-dist

      - qnx-generic-test-vm:
          name: x86_64-qnx-test-library-compiletest
          targets: x86_64-pc-nto-qnx710
          qnx_version: qnx710-472
          target_arch: x86_64
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library)
          test-variant: "2021"
          extra-args: --tests # We do not run cross compiled doctests for this job on this platform, there are segfaults
          resource-class: ferrocene/vm-ubuntu-24-amd64-medium
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - qnx-generic-test-vm:
          name: x86_64-qnx8-test-library-compiletest
          qnx_version: qnx800-141
          targets: x86_64-pc-qnx
          target_arch: x86_64
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library)
          test-variant: "2021"
          extra-args: --tests # We do not run cross compiled doctests for this job on this platform, there are segfaults
          resource-class: ferrocene/vm-ubuntu-24-amd64-medium
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: armv7r-eabihf-test-library-compiletest
          target: armv7r-ferrocene.facade-eabihf
          test_variant: 2021-cortex-r5f
          emulated: "true"
          qemu_arch: qemu-arm
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-r5f
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: thumbv7em-eabihf-test-library-compiletest
          target: thumbv7em-ferrocene.facade-eabihf
          test_variant: 2021-cortex-m4
          emulated: "true"
          qemu_arch: qemu-arm
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-m4
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: thumbv7em-eabihf-test-target-cpu-library-compiletest
          target: thumbv7em-ferrocene.facade-eabihf
          test_variant: 2021-specific-cortex-m4
          emulated: "true"
          qemu_arch: qemu-arm
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-m4
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64
            - thumbv7em-eabihf-test-library-compiletest

      - ferrocene/facade_generic_test:
          name: thumbv7em-eabi-test-library-compiletest
          target: thumbv7em-ferrocene.facade-eabi
          test_variant: 2021-cortex-m4
          emulated: "true"
          qemu_arch: qemu-arm
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-m4
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64

      - ferrocene/facade_generic_test:
          name: thumbv7em-eabi-test-target-cpu-library-compiletest
          target: thumbv7em-ferrocene.facade-eabi
          test_variant: 2021-specific-cortex-m4
          emulated: "true"
          qemu_arch: qemu-arm
          qemu_version: << pipeline.parameters.qemu-version >>
          qemu_cpu: cortex-m4
          restore_from_job: x86_64-linux-build
          tasks: $(ferrocene/ci/split-tasks.py qnx:compiletest-no-only-hosts) $(ferrocene/ci/split-tasks.py test:library-nostd)
          test_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:runner--<< pipeline.parameters.docker-images-hash >>--x86_64
          testserver_image: harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:emulator--<< pipeline.parameters.docker-images-hash >>--x86_64
          requires:
            - x86_64-linux-build
            - build-docker--emulator--x86_64
            - thumbv7em-eabi-test-library-compiletest

      - qnx-generic-test-vm:
