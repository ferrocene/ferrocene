            - x86_64-linux-self-test-qnx8
            - x86_64-windows-self-test
            - x86_64-windows-self-test-qnx8
            - wasm-dist-oxidos
            - aarch64-linux-self-test
            - aarch64-darwin-self-test
            - aarch64-darwin-test
            - aarch64-darwin-test-library
            - aarch64-darwin-compiletest
            - sbom-gen

  # CircleCI doesn't like a build when no jobs are actually executed, treating
  # it as a build failure. Due to how our workflows are setup this will happen
  # for the branches bors lands code in, as those branches are not meant to run
  # any test. To work around the issue this workflow starts a simple job doing
  # nothing when a build for those branches is requested.
  skip:
    when:
      or:
        # These branches are excluded from all the other workflows:
        - equal: [<< pipeline.git.branch >>, "staging.tmp"]
        - equal: [<< pipeline.git.branch >>, "staging-squash-merge.tmp"]
        - equal: [<< pipeline.git.branch >>, "trying.tmp"]
        - equal: [<< pipeline.git.branch >>, "main"]
        - matches:
            pattern: "^release\\/.*"
            value: << pipeline.git.branch >>
    jobs:
      - skip

commands:
  ferrocene-job-build:
    description: Collection of steps for build jobs
    parameters:
      os:
        type: string
        default: linux # Or `windows` or `darwin`
      llvm_build:
        type: boolean
        default: false
      awscli_version:
        type: string
        default: << pipeline.parameters.awscli-version >>
      override_installed:
        type: boolean
        default: false
    steps:
      - ferrocene/checkout:
          llvm_subset: true
      - ferrocene/setup:
          awscli_version: << parameters.awscli_version >>
          override_installed: << parameters.override_installed >>
          os: <<parameters.os>>
          llvm_build: << parameters.llvm_build >>
      - ferrocene/ci
      # Persist the build artifacts so following jobs don't have to start from
      # scratch. The build directory is shrinked beforehand to avoid persisting
      # too much data (slowing down uploads and downloads).
      - run:
          name: Shrink the build directory before persisting it
          command: ferrocene/ci/scripts/shrink-build-directory.sh
      - run:
          name: Persist build output between jobs
          command: ferrocene/ci/scripts/persist-between-jobs.sh upload ./build

  ferrocene-job-dist:
    description: Collection of steps for dist jobs
    parameters:
      os:
        type: string
        default: linux # Or `windows` or `darwin`
      awscli_version:
        type: string
        default: << pipeline.parameters.awscli-version >>
      override_installed:
        type: boolean
        default: false
      restore-from-job:
        type: string
        default: ""
      llvm_subset:
        type: boolean
        default: true
      qnx7:
        type: boolean
        default: false
      qnx8:
        type: boolean
        default: false
    steps:
      - ferrocene/checkout:
          llvm_subset: << parameters.llvm_subset >>
      - ferrocene/setup:
          awscli_version: << parameters.awscli_version >>
          override_installed: << parameters.override_installed >>
          os: <<parameters.os>>
          llvm_build: false
      - when:
          condition: <<parameters.restore-from-job>>
          steps:
            - ferrocene/restore_from_job:
                from_job: << parameters.restore-from-job >>
      - when:
          condition:
            equal: [<<parameters.qnx7>>, true]
          steps:
            - setup-qnx-toolchain:
                qnx_version: qnx710-472
      - when:
          condition:
            equal: [<<parameters.qnx8>>, true]
          steps:
            - setup-qnx-toolchain:
                qnx_version: qnx800-141
      - ferrocene/ci

  ferrocene-job-test-container:
    description: Collection of steps for test jobs in containers
    parameters:
      restore-from-job:
        type: string
      os:
        type: string
        default: linux # Or `windows` or `darwin`
    steps:
      - ferrocene/checkout:
          llvm_subset: true
      - ferrocene/setup:
          awscli_version: << pipeline.parameters.awscli-version >>
          os: <<parameters.os>>
      - ferrocene/restore_from_job:
          from_job: << parameters.restore-from-job >>
      - ferrocene/ci

  ferrocene-job-test-vm:
    description: Collection of steps for test jobs in VMs
    # a separate Docker image can be used to run a newer version of e.g. QEMU than
    # the version available in `docker-image-tag`
    parameters:
      # the "preparing the emulator" and other steps will run in this Docker image
      docker-image-tag:
        type: string
      # the "running the emulator" step will run in this Docker image
      run-emulator-docker-image-tag:
        type: string
      restore-from-job:
        type: string
      emulator-script:
        type: string
        default: ""
      checkout-source:
        type: boolean
        default: true
    steps:
      - when:
          condition: << parameters.checkout-source >>
          steps:
            - ferrocene/checkout:
                llvm_subset: true
      - ferrocene/setup:
          awscli_version: << pipeline.parameters.awscli-version >>
          override_installed: false
      - ferrocene/restore_from_job:
          from_job: << parameters.restore-from-job>>

      - run:
          name: Pull the Docker image used for CI
          command: |
            # Use our cluster-local pull-through cache. We don't need to authenticate as the credentials are
            # injected at VM startup
            docker pull harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:<< parameters.docker-image-tag >>
            docker pull harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:<< parameters.run-emulator-docker-image-tag >>

      - when:
          condition: << parameters.emulator-script >>
          steps:
            - run:
                name: Create emulator directory
                command: mkdir -p $HOME/tmp/emulator

            - run:
                name: Prepare emulator
                command: |
                  docker run \
                    --device /dev/kvm \
                    --rm \
                    $(uv run python3 -c "import os; print(' '.join('--env ' + var for var in os.environ if var not in ['HOME', 'LANG', 'SUDO_USER', 'PATH', 'VIRTUAL_ENV']))") \
                    -e SCRIPT="<< parameters.emulator-script >> prepare" \
                    --workdir /project \
                    --volume $(pwd):/project \
                    --volume $HOME/tmp/emulator:/tmp/emulator \
                    --volume /tmp/awsjwt:/tmp/awsjwt \
                    --user "$(id -u):$(id -g)" \
                    --group-add "$(getent group kvm | cut -d: -f3)" \
                    --network host \
                    --privileged \
                    --interactive \
                    --tty \
                    harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:<< parameters.docker-image-tag >> \
                    ferrocene/ci/run.sh
                    # Actual command set in -e SCRIPT=... above!

            - run:
                name: Execute emulator in the background
                background: true
                command: |
                  docker run \
                    --rm \
                    $(uv run python3 -c "import os; print(' '.join('--env ' + var for var in os.environ if var not in ['HOME', 'LANG', 'SUDO_USER', 'PATH', 'VIRTUAL_ENV']))") \
                    --workdir /project \
                    --volume $(pwd):/project \
                    --volume $HOME/tmp/emulator:/tmp/emulator \
                    --volume /tmp/awsjwt:/tmp/awsjwt \
                    --user "$(id -u):$(id -g)" \
                    --group-add "$(getent group kvm | cut -d: -f3)" \
                    --network host \
                    --privileged \
                    --interactive \
                    --tty \
                    harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:<< parameters.run-emulator-docker-image-tag >> \
                    bash -c "<< parameters.emulator-script >>"

      - ferrocene/ci:
          wrapper: |
            docker run \
              --rm \
              $(uv run python3 -c "import os; print(' '.join('--env ' + var for var in os.environ if var not in ['HOME', 'LANG', 'SUDO_USER', 'PATH', 'VIRTUAL_ENV']))") \
              --workdir /project \
              --volume $(pwd):/project \
              --volume $HOME/tmp/emulator:/tmp/emulator \
              --volume /tmp/ferrocene:/tmp/ferrocene \
              --user "$(id -u):$(id -g)" \
              --group-add "$(getent group kvm | cut -d: -f3)" \
              --network host \
              --interactive \
              --tty \
              harbor.infra.ferrous-systems.net/ferrocene-ci-ecr-cache/ci-docker-images:<< parameters.docker-image-tag >> \

  setup-qnx-toolchain:
    description: Setup QNX Toolchain
    parameters:
      source-env-script:
        type: boolean
        default: true
      qnx_version:
        description: "The QNX version to set up (currently supported: qnx710-472, qnx800-141)"
        type: string
    steps:
      - run:
          name: Fetch << parameters.qnx_version >> toolchain
          # On Windows, the virtualenv detection seems to struggle at times.
          command: |
            ferrocene/ci/scripts/cache.py retrieve s3://ferrocene-ci-mirrors/manual/qnx/<< parameters.qnx_version >>-deployment.tar.zst .
      - when:
          condition: << parameters.source-env-script >>
          steps:
            - run:
                name: Set PATH to include << parameters.qnx_version >> tools
                command: echo 'source $(pwd)/<< parameters.qnx_version >>/qnxsdp-env.sh' >> "$BASH_ENV"

executors:
  linux-vm:
    machine:
      image: ubuntu-2604:current
