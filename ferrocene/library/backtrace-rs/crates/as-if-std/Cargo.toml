[package]
name = "as-if-std"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false
doc = false
doctest = false
bench = false

[dependencies]
cfg-if = "1.0"
rustc-demangle = "0.1.27"
libc = { version = "0.2.156", default-features = false }

[target.'cfg(not(all(windows, target_env = "msvc", not(target_vendor = "uwp"))))'.dependencies]
miniz_oxide = { version = "0.9", optional = true, default-features = false }
ruzstd = { version = "0.9.1", optional = true, default-features = false }
addr2line = { version = "0.27.0", optional = true, default-features = false }

[target.'cfg(not(all(windows, target_env = "msvc", not(target_vendor = "uwp"))))'.dependencies.object]
version = "0.40.0"
default-features = false
optional = true
features = ['read_core', 'elf', 'macho', 'pe', 'xcoff', 'unaligned', 'archive']

[target.'cfg(any(windows, target_os = "cygwin"))'.dependencies]
windows-link = "0.2"

[features]
default = ['backtrace']
backtrace = ['addr2line', 'miniz_oxide', 'object', 'ruzstd']
std = []

[lints.rust]
unexpected_cfgs = "allow"
