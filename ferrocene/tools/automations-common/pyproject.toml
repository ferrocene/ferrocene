[project]
name = "automations-common"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "requests ~= 2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# When updating with `uv lock --upgrade`, don't pull just-uploaded packages
# This is a small mitigation against malicious package uploads
[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
certifi = false
