[package]
name = "generate-tarball"
edition.workspace = true

[dependencies]
anyhow = "1.0.19"
rayon = "1.0"
tar = "0.4.38"
walkdir = "2"
xz2 = "0.1.4"
criticaltrust = { version = "0.5.1", features = ["aws-kms"] }
sha2 = "0.10.7"
tokio = { version = "1.29.1", features = ["rt-multi-thread", "rt"] }
serde_json = "1.0.99"

[dependencies.aws-config]
version = "1.13.0"
default-features = false
# default features minus `rustls` plus `behavior-version-latest`
features = [
  "behavior-version-latest",
  "credentials-process",
  "default-https-client",
  "rt-tokio",
  "sso",
]

[dependencies.aws-sdk-kms]
version = "1.124.0"
default-features = false
# default features minus `rustls`
features = [
  "default-https-client",
  "rt-tokio",
]

[dependencies.clap]
features = ["derive"]
version = "4.2.0"

[dev-dependencies]
insta = "1.31.0"
tempfile = "3.5.0"
